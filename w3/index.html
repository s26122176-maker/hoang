<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CYBER MEME | 賽博迷因產生器</title>

  <!-- 1. 引入 Google Fonts (未來感英文字體 Orbitron + 中文無襯線體 Noto Sans TC) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@700;900&family=Orbitron:wght@800;900&display=swap" rel="stylesheet">

  <!-- 2. 引入 html2canvas CDN (將 HTML 區塊轉為圖片下載的核心套件) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <style>
    /* ==================== CSS 樣式與主題設定 ==================== */
    :root {
      --bg-dark: #080711;
      --panel-bg: rgba(20, 18, 38, 0.85);
      --neon-blue: #00f3ff;
      --neon-pink: #ff0055;
      --text-main: #ffffff;
      --font-meme: 'Impact', 'Orbitron', 'Noto Sans TC', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: 'Noto Sans TC', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px;
      /* 背景酷炫網格線 */
      background-image: 
        linear-gradient(rgba(0, 243, 255, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 243, 255, 0.05) 1px, transparent 1px);
      background-size: 30px 30px;
    }

    /* 網頁標題 */
    .app-header {
      text-align: center;
      margin-bottom: 28px;
    }

    .app-title {
      font-family: 'Orbitron', 'Noto Sans TC', sans-serif;
      font-size: 2.2rem;
      font-weight: 900;
      color: var(--neon-blue);
      text-shadow: 0 0 10px var(--neon-blue), 0 0 20px var(--neon-blue);
      letter-spacing: 2px;
    }

    .app-subtitle {
      font-size: 0.9rem;
      color: #8a8fb5;
      margin-top: 6px;
    }

    /* 主容器：電腦版為左右併排 */
    .meme-app-container {
      display: flex;
      flex-direction: row;
      gap: 28px;
      width: 100%;
      max-width: 1050px;
      align-items: flex-start;
      justify-content: center;
    }

    /* 控制面板區 */
    .control-panel {
      flex: 1;
      background: var(--panel-bg);
      border: 1px solid rgba(0, 243, 255, 0.3);
      box-shadow: 0 0 20px rgba(0, 243, 255, 0.15);
      border-radius: 12px;
      padding: 24px;
      backdrop-filter: blur(10px);
      width: 100%;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      font-size: 0.9rem;
      font-weight: bold;
      color: var(--neon-blue);
      margin-bottom: 8px;
    }

    /* 檔案選擇按鈕美化 */
    input[type="file"] {
      width: 100%;
      padding: 10px;
      background: rgba(10, 11, 20, 0.8);
      border: 1px dashed var(--neon-blue);
      color: #fff;
      border-radius: 6px;
      cursor: pointer;
    }

    /* 文字輸入框風格 */
    input[type="text"] {
      width: 100%;
      padding: 12px;
      background: rgba(10, 11, 20, 0.8);
      border: 1px solid rgba(0, 243, 255, 0.4);
      color: #fff;
      border-radius: 6px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.3s, box-shadow 0.3s;
    }

    input[type="text"]:focus {
      border-color: var(--neon-pink);
      box-shadow: 0 0 10px var(--neon-pink);
    }

    /* 滑桿風格微調 */
    .slider-container {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    input[type="range"] {
      flex: 1;
      accent-color: var(--neon-blue);
      cursor: pointer;
    }

    .slider-value {
      font-size: 0.85rem;
      color: #aaa;
      min-width: 45px;
      text-align: right;
    }

    /* 一鍵下載超酷按鈕 */
    .download-btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(45deg, var(--neon-blue), var(--neon-pink));
      border: none;
      border-radius: 8px;
      color: #fff;
      font-size: 1.05rem;
      font-weight: 800;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1px;
      box-shadow: 0 0 15px rgba(255, 0, 85, 0.4);
      transition: all 0.3s ease;
      margin-top: 8px;
    }

    .download-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 25px rgba(0, 243, 255, 0.7);
    }

    /* 迷因即時預覽區 */
    .preview-area {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
    }

    /* 包含圖片與文字的迷因卡片本體（此區塊會被 html2canvas 截圖） */
    .meme-box {
      position: relative;
      width: 100%;
      max-width: 500px;
      background-color: #000;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      user-select: none;
    }

    /* 迷因底圖 */
    .meme-box img {
      width: 100%;
      height: auto;
      display: block;
      object-fit: contain;
    }

    /* 迷因通用文字樣式 */
    .meme-text {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      text-align: center;
      color: #ffffff;
      font-family: var(--font-meme);
      font-weight: 900;
      text-transform: uppercase;
      word-break: break-word;
      line-height: 1.2;
      
      /* 核心黑邊技巧：利用 8 方向多重 text-shadow 打造絕不發白的黑色粗邊框 */
      text-shadow: 
        -2px -2px 0 #000,  2px -2px 0 #000,
        -2px  2px 0 #000,  2px  2px 0 #000,
        -3px  0px 0 #000,  3px  0px 0 #000,
         0px -3px 0 #000,  0px  3px 0 #000,
         0px  0px 8px rgba(0,0,0,0.8);
    }

    /* 上方文字定位 */
    .meme-text.top {
      top: 5%;
    }

    /* 下方文字定位 */
    .meme-text.bottom {
      bottom: 5%;
    }

    /* RWD 響應式：手機或平板自動調整為上下直排 */
    @media (max-width: 768px) {
      .meme-app-container {
        flex-direction: column;
      }

      .app-title {
        font-size: 1.7rem;
      }

      .control-panel {
        padding: 18px;
      }
    }
  </style>
</head>
<body>

  <!-- 網頁頁首標題區 -->
  <header class="app-header">
    <h1 class="app-title">CYBER MEME GENERATOR</h1>
    <p class="app-subtitle">賽博迷因產生器 • 自定義圖片與文字梗圖</p>
  </header>

  <!-- 主功能區 -->
  <main class="meme-app-container">

    <!-- 控制面板區 (桌面左側 / 手機上方) -->
    <section class="control-panel">
      
      <!-- 1. 本機圖片上傳 -->
      <div class="form-group">
        <label for="imageLoader">1. 選擇背景圖片（本機檔案）</label>
        <input type="file" id="imageLoader" accept="image/*">
      </div>

      <!-- 2. 上方文字輸入框 -->
      <div class="form-group">
        <label for="topTextInput">2. 上方文字 (Top Text)</label>
        <input type="text" id="topTextInput" placeholder="輸入上方迷因文字...">
      </div>

      <!-- 3. 下方文字輸入框 -->
      <div class="form-group">
        <label for="bottomTextInput">3. 下方文字 (Bottom Text)</label>
        <input type="text" id="bottomTextInput" placeholder="輸入下方迷因文字...">
      </div>

      <!-- 4.1 字體大小調整滑桿 -->
      <div class="form-group">
        <label>字體大小 (Font Size)</label>
        <div class="slider-container">
          <input type="range" id="fontSizeSlider" min="20" max="75" value="36">
          <span class="slider-value" id="fontSizeVal">36px</span>
        </div>
      </div>

      <!-- 4.2 上方文字垂直位置滑桿 -->
      <div class="form-group">
        <label>上方文字位置 (Top Position)</label>
        <div class="slider-container">
          <input type="range" id="topPosSlider" min="0" max="40" value="5">
          <span class="slider-value" id="topPosVal">5%</span>
        </div>
      </div>

      <!-- 4.3 下方文字垂直位置滑桿 -->
      <div class="form-group">
        <label>下方文字位置 (Bottom Position)</label>
        <div class="slider-container">
          <input type="range" id="bottomPosSlider" min="0" max="40" value="5">
          <span class="slider-value" id="bottomPosVal">5%</span>
        </div>
      </div>

      <!-- 5. 一鍵下載按鈕 -->
      <button class="download-btn" id="downloadBtn">🚀 一鍵下載迷因 (my-meme.png)</button>

    </section>

    <!-- 迷因即時預覽區 (桌面右側 / 手機下方) -->
    <section class="preview-area">
      <!-- 被 html2canvas 捕捉繪製的區塊 -->
      <div class="meme-box" id="memeBox">
        <!-- 預設範例圖：Unsplash 線上免費圖片 -->
        <img id="memeImage" src="https://images.unsplash.com/photo-1531259683007-016a7b628fc3?auto=format&fit=crop&w=600&q=80" alt="迷因底圖" crossorigin="anonymous">
        
        <!-- 上方迷因文字 -->
        <div class="meme-text top" id="topTextDisplay">當你第一次寫前端網頁</div>
        
        <!-- 下方迷因文字 -->
        <div class="meme-text bottom" id="bottomTextDisplay">而且居然一次就過的時候</div>
      </div>
    </section>

  </main>

  <!-- ==================== JAVASCRIPT 邏輯處理 ==================== -->
  <script>
    // 取得所有 HTML 節點元素 (DOM)
    const imageLoader = document.getElementById('imageLoader');
    const memeImage = document.getElementById('memeImage');
    
    const topTextInput = document.getElementById('topTextInput');
    const bottomTextInput = document.getElementById('bottomTextInput');
    const topTextDisplay = document.getElementById('topTextDisplay');
    const bottomTextDisplay = document.getElementById('bottomTextDisplay');

    const fontSizeSlider = document.getElementById('fontSizeSlider');
    const fontSizeVal = document.getElementById('fontSizeVal');
    const topPosSlider = document.getElementById('topPosSlider');
    const topPosVal = document.getElementById('topPosVal');
    const bottomPosSlider = document.getElementById('bottomPosSlider');
    const bottomPosVal = document.getElementById('bottomPosVal');

    const downloadBtn = document.getElementById('downloadBtn');
    const memeBox = document.getElementById('memeBox');

    /* ----------------------------------------------------
       1. 使用 FileReader 讀取本機圖片（100% 避開 CORS 錯誤）
    ---------------------------------------------------- */
    imageLoader.addEventListener('change', function(e) {
      const file = e.target.files[0];
      
      // 確認使用者有選擇圖片檔案
      if (file) {
        const reader = new FileReader();
        
        // 當瀏覽器讀取完檔案數據後觸發
        reader.onload = function(event) {
          memeImage.src = event.target.result; // 將圖片轉換為 Base64 數據指派給 <img>
        };
        
        // 以 DataURL 格式讀取圖檔
        reader.readAsDataURL(file);
      }
    });

    /* ----------------------------------------------------
       2. 文字輸入即時監聽與同步顯示
    ---------------------------------------------------- */
    topTextInput.addEventListener('input', function() {
      topTextDisplay.textContent = this.value || '上方文字';
    });

    bottomTextInput.addEventListener('input', function() {
      bottomTextDisplay.textContent = this.value || '下方文字';
    });

    /* ----------------------------------------------------
       3. 參數滑桿控制 (字體大小與上下位置)
    ---------------------------------------------------- */
    // 調整字體大小
    fontSizeSlider.addEventListener('input', function() {
      const size = this.value + 'px';
      topTextDisplay.style.fontSize = size;
      bottomTextDisplay.style.fontSize = size;
      fontSizeVal.textContent = size;
    });

    // 調整上方文字 Top 距離
    topPosSlider.addEventListener('input', function() {
      const pos = this.value + '%';
      topTextDisplay.style.top = pos;
      topPosVal.textContent = pos;
    });

    // 調整下方文字 Bottom 距離
    bottomPosSlider.addEventListener('input', function() {
      const pos = this.value + '%';
      bottomTextDisplay.style.bottom = pos;
      bottomPosVal.textContent = pos;
    });

    /* ----------------------------------------------------
       4. 使用 html2canvas 轉成圖片並自動下載
    ---------------------------------------------------- */
    downloadBtn.addEventListener('click', function() {
      // 顯示下載狀態
      const originalBtnText = downloadBtn.textContent;
      downloadBtn.textContent = '⏳ 生成中...';
      downloadBtn.style.opacity = '0.7';

      // 呼叫 html2canvas 套件，傳入要截圖的 DOM 區塊 (#memeBox)
      html2canvas(memeBox, {
        scale: 2,       // 提升 2 倍畫質，下載下來的圖片更清晰
        useCORS: true,  // 允許跨域圖片處理
        allowTaint: true
      }).then(function(canvas) {
        // 將畫布轉為 PNG data 網址
        const imageUrl = canvas.toDataURL('image/png');

        // 創建動態 <a> 標籤觸發瀏覽器下載機制
        const link = document.createElement('a');
        link.href = imageUrl;
        link.download = 'my-meme.png'; // 設定下載預設檔名
        link.click();

        // 恢復按鈕原本樣式
        downloadBtn.textContent = originalBtnText;
        downloadBtn.style.opacity = '1';
      }).catch(function(err) {
        console.error('截圖下載失敗:', err);
        alert('下載失敗，請嘗試更換圖片或重新整理網頁！');
        downloadBtn.textContent = originalBtnText;
        downloadBtn.style.opacity = '1';
      });
    });
  </script>
</body>
</html>
