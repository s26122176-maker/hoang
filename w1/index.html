<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>個人數位名片</title>
    <!-- 引入 Google Fonts 提升字體質感 -->
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- 引入 Font Awesome 圖示庫 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* 全局重置與背景設置 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Quicksand', 'Noto Sans TC', sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            /* 馬卡龍粉藍漸層背景 */
            background: linear-gradient(135deg, #fbc2eb 0%, #a6c1ee 100%);
            padding: 20px;
        }

        /* 卡片主體 */
        .profile-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px); /* 毛玻璃質感 */
            border: 1px solid rgba(255, 255, 255, 0.6);
            padding: 40px 30px;
            border-radius: 28px;
            text-align: center;
            max-width: 360px;
            width: 100%;
            /* 現代感柔和微陰影 */
            box-shadow: 0 12px 32px rgba(165, 140, 185, 0.2);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        /* 懸停時微浮動 */
        .profile-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 16px 40px rgba(165, 140, 185, 0.3);
        }

        /* 圓形大頭貼外框與圖片 */
        .avatar-wrapper {
            width: 130px;
            height: 130px;
            margin: 0 auto 20px;
            border-radius: 50%;
            padding: 4px;
            /* 馬卡龍粉色微光澤漸層外框 */
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
            box-shadow: 0 8px 20px rgba(255, 154, 158, 0.35);
        }

        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            background-color: #fff;
        }

        /* 名字風格 */
        .name {
            font-size: 1.6rem;
            font-weight: 700;
            color: #4a4a4a;
            margin-bottom: 8px;
        }

        /* 自我介紹風格 */
        .bio {
            font-size: 0.95rem;
            color: #6e6e6e;
            line-height: 1.5;
            margin-bottom: 28px;
            font-weight: 500;
        }

        /* 按鈕容器 */
        .action-buttons {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        /* 按鈕基礎樣式 */
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 12px 24px;
            border-radius: 50px;
            text-decoration: none;
            font-size: 1rem;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        /* Instagram 馬卡龍粉橘按鈕 */
        .btn-instagram {
            background: linear-gradient(135deg, #ffb7b2 0%, #ffdac1 100%);
            color: #6a3b3a;
            box-shadow: 0 4px 12px rgba(255, 183, 178, 0.4);
        }

        .btn-instagram:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(255, 183, 178, 0.6);
        }

        /* Email 馬卡龍粉藍綠按鈕 */
        .btn-email {
            background: linear-gradient(135deg, #c7ceea 0%, #e2f0cb 100%);
            color: #3b4260;
            box-shadow: 0 4px 12px rgba(199, 206, 234, 0.4);
        }

        .btn-email:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(199, 206, 234, 0.6);
        }
    </style>
</head>
<body>

    <div class="profile-card">
        <!-- 圓形大頭貼 -->
        <div class="avatar-wrapper">
            <img src="102c15ae-d18b-48b4-99c0-ffadf85b0eb5.jpg" alt="大頭貼" class="avatar">
        </div>

        <!-- 姓名與簡介 -->
        <h1 class="name">姓名 / Name</h1>
        <p class="bio">✨ 這裡是一行簡短的自我介紹，記錄生活與美好點滴。</p>

        <!-- 連結按鈕 -->
        <div class="action-buttons">
            <a href="https://instagram.com" target="_blank" class="btn btn-instagram">
                <i class="fa-brands fa-instagram"></i> Instagram
            </a>
            <a href="mailto:your-email@gmail.com" class="btn btn-email">
                <i class="fa-regular fa-envelope"></i> 傳送 Email
            </a>
        </div>
    </div>

</body>
</html>
