<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2222 未來作品集 | Portfolio 2222</title>
    <style>
        /* ==================== 1. 全域變數與重置 ==================== */
        :root {
            --bg-dark: #080711;
            --card-bg: rgba(20, 18, 38, 0.75);
            --neon-blue: #00f3ff;
            --neon-pink: #ff0055;
            --text-main: #ffffff;
            --locked-gray: #4a4d6d;
            --font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: var(--font-family);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 40px 20px;
            overflow-x: hidden;
            position: relative;
        }

        /* 2222 未來網格背景 */
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: 
                linear-gradient(rgba(8, 7, 17, 0.85), rgba(8, 7, 17, 0.85)),
                linear-gradient(90deg, rgba(0, 243, 255, 0.05) 1px, transparent 1px),
                linear-gradient(0deg, rgba(0, 243, 255, 0.05) 1px, transparent 1px);
            background-size: 100% 100%, 30px 30px, 30px 30px;
            z-index: -2;
        }

        /* 動態 CRT 掃描線效果 */
        body::after {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(180deg, rgba(255,255,255,0), rgba(255,255,255,0.03) 50%, rgba(0,0,0,0.3) 51%);
            background-size: 100% 4px;
            z-index: -1;
            pointer-events: none;
        }

        /* ==================== 2. 中央大頭貼與個人資訊 ==================== */
        .profile-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 40px;
            text-align: center;
        }

        .avatar-wrapper {
            position: relative;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            padding: 4px;
            background: linear-gradient(45deg, var(--neon-blue), var(--neon-pink));
            box-shadow: 0 0 25px rgba(0, 243, 255, 0.4);
            animation: pulse-glow 3s infinite alternate;
        }

        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            background-color: #1a1829;
            border: 3px solid var(--bg-dark);
        }

        .profile-name {
            margin-top: 16px;
            font-size: 1.8rem;
            font-weight: 800;
            letter-spacing: 2px;
            color: #fff;
            text-shadow: 0 0 10px var(--neon-blue), 0 0 20px var(--neon-blue);
        }

        .profile-subtitle {
            margin-top: 6px;
            font-size: 0.9rem;
            color: #8a8fb5;
            letter-spacing: 1px;
        }

        /* ==================== 3. 16 個關卡選單網格 ==================== */
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr); /* 桌機版每列 4 個 */
            gap: 20px;
            width: 100%;
            max-width: 1000px;
            margin: 0 auto;
        }

        .level-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 20px 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            position: relative;
            backdrop-filter: blur(8px);
            transition: all 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            min-height: 110px;
            user-select: none;
        }

        .level-number {
            position: absolute;
            top: 10px;
            left: 12px;
            font-size: 0.75rem;
            font-weight: bold;
            opacity: 0.6;
        }

        .level-title {
            font-size: 1rem;
            font-weight: 700;
            text-align: center;
            margin-top: 6px;
            word-break: break-word;
        }

        /* ==================== 4. 按鈕解鎖狀態 (Unlocked) ==================== */
        .level-card.unlocked {
            border: 1px solid rgba(0, 243, 255, 0.4);
            color: var(--text-main);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            cursor: pointer;
        }

        .level-card.unlocked .level-number {
            color: var(--neon-blue);
        }

        /* 已解鎖懸停動畫 */
        .level-card.unlocked:hover {
            transform: translateY(-8px) scale(1.03);
            border-color: var(--neon-blue);
            box-shadow: 0 10px 25px rgba(0, 243, 255, 0.4),
                        0 0 15px rgba(0, 243, 255, 0.6);
        }

        .level-card.unlocked:hover .level-title {
            color: var(--neon-blue);
            text-shadow: 0 0 8px var(--neon-blue);
        }

        /* ==================== 5. 按鈕鎖定狀態 (Locked) ==================== */
        .level-card.locked {
            border: 1px dashed var(--locked-gray);
            background: rgba(15, 14, 26, 0.5);
            color: #5d6185;
            cursor: not-allowed;
            filter: grayscale(80%);
        }

        .level-card.locked .lock-icon {
